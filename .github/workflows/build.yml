name: Build APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION: v1.0.${{ github.run_number }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 运行单元测试（音高检测算法）
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: 编译 Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 重命名 APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/GuitarMagic-${VERSION}.apk"
          ls -l out

      - name: 上传 APK（构建产物）
        uses: actions/upload-artifact@v4
        with:
          name: GuitarMagic-${{ env.VERSION }}
          path: out/*.apk

      - name: 发布到 GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Guitar Magic ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          body: |
            自动编译的调试版 APK（提交 ${{ github.sha }}）。
            在安卓手机浏览器中点击下方 Assets 里的 `GuitarMagic-${{ env.VERSION }}.apk` 下载并安装。
          files: out/*.apk
          make_latest: true
